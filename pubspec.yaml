name: flutter_clean_architecture_template
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ">=3.11.5 <4.0.0"

dependencies:
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  easy_localization: ^3.0.8
  equatable: ^2.0.8
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_flavor: ^3.1.4
  flutter_native_splash: ^2.4.7
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^10.0.0
  get_it: ^9.2.1
  go_router: ^17.1.0
  intl: ^0.20.2
  logger: ^2.7.0
  shared_preferences: ^2.5.4
  shared_preferences_android: ^2.4.28
  shimmer: ^3.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_launcher_icons: ^0.14.4
  flutter_svg: ^2.3.0
  device_preview: ^3.0.0

dev_dependencies:
  build_runner: ^2.4.13
  hive_generator: ^2.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_gen:
  output: lib/generated/
  integrations:
    flutter_svg: true



flutter:

  uses-material-design: true

  assets:
    - assets/translations/
    - assets/dummy/
    - assets/images/
    - assets/icons/

  fonts:
    # Figma: Instrument Sans (variable — supports wght 450/550 via fontVariations)
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/InstrumentSans-Variable.ttf
        - asset: assets/fonts/InstrumentSans-Italic-Variable.ttf
          style: italic
    # Figma: Instrument Serif (heading/display)
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic
