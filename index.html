<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/wize-app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="FitDaily turns your smartwatch data into clear steps, calories, heart-rate and sleep insights, and helps you train toward goals that stick.">
  <!-- Brand color (AppColors.bgBrand / Splash, figma 683:53900) -->
  <meta name="theme-color" content="#5B23FF">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FitDaily">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon: Figma logo mark on the Splash gradient -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">

  <title>FitDaily</title>
  <link rel="manifest" href="manifest.json">

  <!-- Same as device_preview's letterbox (DotGridDecoration), so there is no
       white flash before Flutter paints. -->
  <style>
    html, body { margin: 0; height: 100%; background: #232327; }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
