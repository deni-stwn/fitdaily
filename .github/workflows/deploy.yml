# yaml
# name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main # Jalankan otomatis setiap kamu push ke branch main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
        contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --base-href "/wize-app/" --release

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages # Folder build/web akan otomatis 